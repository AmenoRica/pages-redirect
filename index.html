<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pages.dev Redirect</title>
    <meta name="description" content="짧은 주소로 원하는 pages.dev 사이트에 이동합니다.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Pages.dev Redirect">
    <meta property="og:description" content="?red=사이트이름 형식으로 원하는 pages.dev 사이트에 이동하세요.">
    <meta property="og:url" content="https://amenorica.github.io/pages-redirect/">
    <meta property="og:image" content="https://amenorica.github.io/pages-redirect/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pages.dev Redirect">
    <meta name="twitter:description" content="?red=사이트이름 형식으로 원하는 pages.dev 사이트에 이동하세요.">
    <meta name="twitter:image" content="https://amenorica.github.io/pages-redirect/preview.png">
    <script>
      const value = new URLSearchParams(location.search).get('red');
      if (value && /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(value)) {
        location.replace(`https://${value}.pages.dev/`);
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(32rem, calc(100% - 3rem)); }
      code { padding: .2rem .4rem; border-radius: .35rem; background: color-mix(in srgb, currentColor 10%, transparent); }
      p { line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pages.dev Redirect</h1>
      <p><code>?red=asdf</code>를 주소 뒤에 붙이면 <code>https://asdf.pages.dev/</code>로 이동합니다.</p>
      <p>사이트 이름에는 영문 소문자, 숫자, 하이픈만 사용할 수 있습니다.</p>
    </main>
  </body>
</html>
